name: Add five scalable export sizes

"on":
  push:

permissions:
  contents: write

jobs:
  update-app:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Add five export sizes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path("pattern_tool.py")
          text = path.read_text(encoding="utf-8")

          pattern = re.compile(
              r'canvas_choice = st\.(?:radio|selectbox)\(\n'
              r'.*?canvas_size = int\(CANVAS_SIZE \* scale_factor\)',
              re.DOTALL,
          )

          replacement = """EXPORT_SIZES = {
              \"2000×2000 px — Standard\": 2000,
              \"3000×3000 px — High detail\": 3000,
              \"4000×4000 px — Professional\": 4000,
              \"5000×5000 px — Large print\": 5000,
              \"6000×6000 px — Maximum detail\": 6000,
          }

          canvas_choice = st.selectbox(
              \"Export size\",
              options=list(EXPORT_SIZES.keys()),
              index=2,
              help=(
                  \"All templates use the same 2000×2000 master layout. \"
                  \"Positions, motif widths and seamless wrapping scale automatically.\"
              ),
          )
          canvas_size = EXPORT_SIZES[canvas_choice]
          scale_factor = canvas_size / CANVAS_SIZE"""

          updated, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit("Could not find the current canvas-size selector.")

          path.write_text(updated, encoding="utf-8")
          PY

      - name: Validate app
        run: python -m py_compile pattern_tool.py

      - name: Commit app update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/refactor-resolution-independent.yml
          git add pattern_tool.py
          git commit -m "Add five scalable export sizes"
          git push origin main
