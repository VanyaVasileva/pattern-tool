name: Apply sharpness fix

on:
  push:
    paths:
      - '.github/workflows/apply-sharpness-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Patch pattern_tool.py
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('pattern_tool.py')
          text = path.read_text(encoding='utf-8')

          old_1 = 'rotated_full = rotate_alpha_safe(motif, slot["rotation"], resample=Image.Resampling.BICUBIC)'
          new_1 = '''rotated_full = rotate_alpha_safe(
              motif,
              slot["rotation"],
              resample=Image.Resampling.BICUBIC,
              suppress_ringing=suppress_ringing,
          )'''

          old_2 = 'rotated_full = rotate_alpha_safe(working, slot["rotation"], resample=Image.Resampling.BICUBIC)'
          new_2 = '''rotated_full = rotate_alpha_safe(
              working,
              slot["rotation"],
              resample=Image.Resampling.BICUBIC,
              suppress_ringing=suppress_ringing,
          )'''

          if old_1 not in text or old_2 not in text:
              raise SystemExit('Expected rotation calls were not found; no changes made.')

          text = text.replace(old_1, new_1, 1)
          text = text.replace(old_2, new_2, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Validate syntax
        run: python -m py_compile pattern_tool.py

      - name: Commit corrected app file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pattern_tool.py
          git commit -m "Keep motifs sharp during rotation"
          git push origin main
