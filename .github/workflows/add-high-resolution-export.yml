name: Add high resolution export

on:
  push:
    paths:
      - '.github/workflows/add-high-resolution-export.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Add 4000px high-detail export option
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('pattern_tool.py')
          text = path.read_text(encoding='utf-8')

          old = '''canvas_choice = st.radio(
              "Canvas size",
              options=["2000×2000 px (motifs ~3cm)", "3000×3000 px (motifs ~5cm)"],
              horizontal=True,
          )
          scale_factor = 1.0 if "2000" in canvas_choice else 1.5
          canvas_size = int(CANVAS_SIZE * scale_factor)'''

          new = '''canvas_choice = st.radio(
              "Canvas size",
              options=[
                  "2000×2000 px (standard)",
                  "3000×3000 px (high detail)",
                  "4000×4000 px (maximum detail)",
              ],
              index=2,
              horizontal=True,
              help="Higher resolution keeps small motifs visibly sharper while preserving the exact same seamless layout and proportions.",
          )
          if "4000" in canvas_choice:
              scale_factor = 2.0
          elif "3000" in canvas_choice:
              scale_factor = 1.5
          else:
              scale_factor = 1.0
          canvas_size = int(CANVAS_SIZE * scale_factor)'''

          if old not in text:
              raise SystemExit('Expected canvas-size block was not found; no changes made.')

          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Validate syntax
        run: python -m py_compile pattern_tool.py

      - name: Commit app update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pattern_tool.py
          git commit -m "Add 4000px high-detail pattern export"
          git push origin main
