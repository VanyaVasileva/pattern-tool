<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: transparent; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .picker { display: flex; align-items: center; gap: 10px; padding: 4px 0; }
    input[type="color"] { width: 54px; height: 42px; padding: 2px; border: 1px solid #ddd; border-radius: 8px; background: white; cursor: pointer; }
    input[type="text"] { width: 112px; height: 42px; padding: 8px 10px; border: 1px solid #ddd; border-radius: 8px; font: 600 15px ui-monospace, SFMono-Regular, Menlo, monospace; }
  </style>
</head>
<body>
  <div class="picker">
    <input id="color" type="color" value="#D8C4B6" aria-label="Choose colour" />
    <input id="hex" type="text" value="#D8C4B6" maxlength="7" aria-label="HEX colour" />
  </div>

  <script>
    const color = document.getElementById("color");
    const hex = document.getElementById("hex");

    // After the user picks a colour locally, ignore incoming "render" resets
    // for a short window. Streamlit can deliver a stale render (still carrying
    // the previous value) right after our own update is sent, which would
    // otherwise snap the picker back to the old colour and make it look like
    // the pick "didn't take" until you tried again.
    let suppressResetsUntil = 0;
    const SUPPRESS_WINDOW_MS = 900;

    function send(type, data = {}) {
      window.parent.postMessage({ isStreamlitMessage: true, type, ...data }, "*");
    }

    function normalize(value) {
      let v = String(value || "").trim().toUpperCase();
      if (!v.startsWith("#")) v = "#" + v;
      return /^#[0-9A-F]{6}$/.test(v) ? v : null;
    }

    function setValue(value, notify = true) {
      const v = normalize(value);
      if (!v) return;
      color.value = v;
      hex.value = v;
      if (notify) {
        suppressResetsUntil = Date.now() + SUPPRESS_WINDOW_MS;
        send("streamlit:setComponentValue", { value: v, dataType: "json" });
      }
    }

    // Native colour panels (e.g. the macOS system picker) don't always fire
    // "input" continuously while the panel is open - bind "change" too so a
    // pick is reliably captured however the browser/OS reports it.
    color.addEventListener("input", () => setValue(color.value));
    color.addEventListener("change", () => setValue(color.value));

    hex.addEventListener("change", () => {
      const v = normalize(hex.value);
      if (v) setValue(v);
      else hex.value = color.value.toUpperCase();
    });

    window.addEventListener("message", event => {
      const message = event.data;
      if (!message || message.type !== "streamlit:render") return;
      const args = message.args || {};
      const incoming = args.default || args.value || "#D8C4B6";
      if (Date.now() >= suppressResetsUntil) {
        setValue(incoming, false);
      }
      send("streamlit:setFrameHeight", { height: document.documentElement.scrollHeight });
    });

    send("streamlit:componentReady", { apiVersion: 1 });
    send("streamlit:setFrameHeight", { height: document.documentElement.scrollHeight });
  </script>
</body>
</html>
